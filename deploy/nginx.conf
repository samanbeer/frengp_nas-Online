# Konfigurace Nginx pro doménu nas.saman.beer
# Umístění: /etc/nginx/sites-available/nas.saman.beer

server {
    listen 80;
    server_name nas.saman.beer;

    # Přesměrování na HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nas.saman.beer;

    # Cesty k SSL certifikátům (např. vygenerované přes Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/nas.saman.beer/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nas.saman.beer/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximální velikost nahrávaného souboru (2 GB)
    client_max_body_size 2048M;

    # Nastavení proxy pro Node.js backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouty pro stahování a nahrávání velkých souborů
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
